{% extends "base.html" %}
{% block page_title %}Audit Log{% endblock %}
{% block content %}
<h5 class="mb-3">Audit Log - System Activity</h5>
<div class="card">
    <table class="table table-sm align-middle mb-0">
        <thead><tr><th>Time</th><th>User</th><th>Action</th><th>Details</th></tr></thead>
        <tbody>
        {% for log in logs %}
        <tr>
            <td class="text-muted">{{ log.created_at }}</td>
            <td>{{ log.username }}</td>
            <td><span class="badge bg-light text-dark border">{{ log.action }}</span></td>
            <td class="text-muted">{{ log.details }}</td>
        </tr>
        {% else %}
        <tr><td colspan="4" class="text-center text-muted">No records yet.</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
